# GRUB2 configuration for Microsoft Surface Pro 11 (LCD)
set default="0"
set timeout=5

# Load partition and filesystem modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod iso9660

# Video and console
insmod all_video
set gfxmode=auto
set gfxpayload=keep
terminal_output console

menuentry "Fedora Linux 41 (Microsoft Surface Pro 11 LCD)" --class fedora --class gnu-linux --class gnu --class os {
    echo "Loading Device Tree: /dtb/qcom/x1p64100-microsoft-denali.dtb..."
    devicetree /dtb/qcom/x1p64100-microsoft-denali.dtb
    echo "Loading Linux Kernel: /vmlinuz-sp11..."
    linux /vmlinuz-sp11 root=LABEL=fedora-root rw clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.mask=tpm2.target console=tty0 earlycon
    echo "Loading Initial RAM Disk: /initramfs-sp11.img..."
    initrd /initramfs-sp11.img
    echo "Booting Surface Pro 11..."
}

menuentry "Fedora Linux 41 (Microsoft Surface Pro 11 LCD - Safe Graphics / Nomodeset)" --class fedora --class gnu-linux --class gnu --class os {
    echo "Loading Device Tree: /dtb/qcom/x1p64100-microsoft-denali.dtb..."
    devicetree /dtb/qcom/x1p64100-microsoft-denali.dtb
    echo "Loading Linux Kernel in safe mode..."
    linux /vmlinuz-sp11 root=LABEL=fedora-root rw clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.mask=tpm2.target nomodeset console=tty0 earlycon
    echo "Loading Initial RAM Disk..."
    initrd /initramfs-sp11.img
    echo "Booting..."
}

menuentry "Fedora Linux 41 (Emergency Single-User Mode)" --class fedora --class gnu-linux --class gnu --class os {
    devicetree /dtb/qcom/x1p64100-microsoft-denali.dtb
    linux /vmlinuz-sp11 root=LABEL=fedora-root rw clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.mask=tpm2.target console=tty0 earlycon single
    initrd /initramfs-sp11.img
}

menuentry "UEFI Firmware Settings" --id 'uefi-firmware' {
    fwsetup
}

menuentry "Reboot System" --class reboot {
    echo "Rebooting system..."
    reboot
}

menuentry "Shutdown System" --class shutdown {
    echo "Shutting down system..."
    halt
}
