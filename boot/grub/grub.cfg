# Fedora Workstation 44 live remix for Microsoft Surface Pro 11 LCD.
set default="0"
set timeout=10
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod iso9660
# This also leaves the standalone GRUB memdisk before loading any payload.
search --no-floppy --file --set=root /vmlinuz-sp11
insmod all_video
set gfxmode=auto
set gfxpayload=keep
terminal_output console

menuentry "Fedora Workstation 44 Live (Surface Pro 11 LCD / GNOME Wayland)" --class fedora {
    echo "Loading Surface LCD device tree..."
    devicetree /dtb/qcom/x1p64100-microsoft-denali.dtb
    echo "Loading Surface kernel..."
    linux /vmlinuz-sp11 root=live:CDLABEL=FEDORA_SP11 rd.live.image rd.live.overlay.overlayfs=1 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.mask=tpm2.target console=tty0 earlycon=efifb keep_bootcon loglevel=7 rd.plymouth=0 plymouth.enable=0
    echo "Loading initramfs with USB live-root drivers..."
    initrd /initramfs-sp11.img
}

menuentry "Fedora Workstation 44 Live (Surface Pro 11 — Camera & Audio Candidate)" --class fedora {
    echo "Loading Surface camera device tree..."
    devicetree /dtb/qcom/x1p64100-microsoft-denali-exp.dtb
    echo "Loading Surface camera candidate kernel..."
    linux /vmlinuz-sp11-exp root=live:CDLABEL=FEDORA_SP11 rd.live.image rd.live.overlay.overlayfs=1 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.mask=tpm2.target console=tty0 earlycon=efifb keep_bootcon loglevel=7 rd.plymouth=0 plymouth.enable=0
    echo "Loading initramfs with camera modules..."
    initrd /initramfs-sp11-exp.img
}

menuentry "Fedora Workstation 44 diagnostics (firmware display / no GPU modesetting)" --class fedora {
    devicetree /dtb/qcom/x1p64100-microsoft-denali.dtb
    linux /vmlinuz-sp11 root=live:CDLABEL=FEDORA_SP11 rd.live.image rd.live.overlay.overlayfs=1 clk_ignore_unused pd_ignore_unused arm64.nopauth systemd.mask=tpm2.target console=tty0 earlycon=efifb keep_bootcon nomodeset rd.driver.blacklist=msm modprobe.blacklist=msm systemd.unit=multi-user.target loglevel=7 ignore_loglevel rd.debug rd.shell rd.plymouth=0 plymouth.enable=0
    initrd /initramfs-sp11.img
}

menuentry "UEFI Firmware Settings" { fwsetup }
menuentry "Reboot" { reboot }
menuentry "Power off" { halt }
