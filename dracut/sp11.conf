# Microsoft Surface Pro 11 LCD; build only after integrating kernel and firmware.
hostonly="no"
# Extend dracut defaults. Replacing dracutmodules omits kernel-modules and USB media.
add_dracutmodules+=" kernel-modules kernel-modules-extra drm systemd systemd-initrd udev-rules rootfs-block fs-lib dmsquash-live "
add_drivers+=" nvme usb_storage uas xhci_hcd xhci_pci xhci_plat_hcd dwc3 dwc3_qcom phy_qcom_qmp_usb phy_qcom_qmp_combo phy_qcom_snps_femto_v2 squashfs erofs loop overlay isofs sd_mod scsi_mod phy_qcom_qmp_pcie phy_qcom_edp panel_edp pwm_bl dispcc_x1e80100 gpucc_x1e80100 msm qrtr pmic_glink pmic_glink_altmode gpio_sbu_mux ucsi_glink surface_aggregator surface_aggregator_registry surface_aggregator_hub surface_aggregator_tabletsw surface_hid surface_hid_core surface_kbd spi_geni_qcom spi_hid spi_hid_of qcom_q6v5_pas "
omit_drivers+=" simpledrm "
filesystems+=" squashfs erofs iso9660 overlay ext4 vfat "
# Firmware remains in the target root; dracut resolves module firmware from it.
fw_dir+=" /usr/lib/firmware "
install_optional_items+=" /etc/sp11-mac.conf "
