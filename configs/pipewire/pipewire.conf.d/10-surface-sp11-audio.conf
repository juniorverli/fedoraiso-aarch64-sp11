# PipeWire configuration override for Microsoft Surface Pro 11
# Optimizes AudioReach latency, speaker DSP volume ceiling, and studio mic beamforming

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 2048
}

# WebRTC Echo Cancellation & Beamforming Filter Chain for Dual Studio Microphones
context.modules = [
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 1024/48000
            source.props = {
                node.name = "Surface_Studio_Mic_Processed"
                node.description = "Surface Pro 11 Studio Microphones (Beamformed + Noise Cancelled)"
            }
        }
    }
]
