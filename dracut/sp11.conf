# Dracut early-boot configuration for Microsoft Surface Pro 11 (X1P / LCD)
# Ensures NVMe, eDP display output (KMS), and Surface Type Cover/Flex keyboard
# are available early during initramfs for console log visibility and LUKS unlock.

add_drivers+=" \
    nvme \
    phy_qcom_qmp_pcie \
    phy_qcom_qmp_combo \
    phy_qcom_edp \
    panel_edp \
    pwm_bl \
    dispcc_x1e80100 \
    gpucc_x1e80100 \
    msm \
    qrtr \
    pmic_glink \
    pmic_glink_altmode \
    gpio_sbu_mux \
    ucsi_glink \
    surface_aggregator \
    surface_aggregator_registry \
    surface_aggregator_hub \
    surface_aggregator_tabletsw \
    surface_hid \
    surface_hid_core \
    surface_kbd \
    spi_geni_qcom \
    spi_hid \
    spi_hid_of \
    qcom_q6v5_pas \
    "

# Force non-hostonly initramfs to guarantee driver availability across installs
hostonly="no"

# Ensure essential dracut modules
dracutmodules+=" drm systemd systemd-initrd udev-rules rootfs-block fs-lib dmsquash-live "
install_optional_items+=" /etc/sp11-mac.conf "
