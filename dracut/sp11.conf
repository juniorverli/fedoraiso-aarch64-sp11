# Dracut early-boot configuration for Microsoft Surface Pro 11 (X1P / LCD)
# Ensures NVMe, eDP display output (KMS), and Surface Type Cover/Flex keyboard
# are available early during initramfs for console log visibility and LUKS unlock.

add_drivers+=" \
    nvme \
    phy_qcom_qmp_pcie \
    phy_qcom_qmp_combo \
    phy_qcom_edp \
    panel_edp \
    pwm_bl \
    dispcc_x1e80100 \
    gpucc_x1e80100 \
    msm \
    qrtr \
    pmic_glink \
    pmic_glink_altmode \
    gpio_sbu_mux \
    ucsi_glink \
    serial_geni_qcom \
    surface_sam \
    surface_aggregator \
    surface_aggregator_registry \
    surface_hid \
    surface_kbd \
    spi_geni_qcom \
    spi_hid \
    qcom_gpi_dma \
    qcom_q6v5_pas \
    "

# Force non-hostonly initramfs to guarantee driver availability across installs
hostonly="no"

# Ensure keyboard and plymouth/kms modules are installed
dracutmodules+=" kms qemu-net systemd systemd-initrd udev-rules "
install_items+=" /etc/sp11-mac.conf "
